name: mlops-phishing

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mlops_phishing}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: mlops-phishing:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mlops_phishing}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-phishing-url-clf}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    logging: *default-logging

  # Брокер задач. Management UI на http://localhost:15672
  rabbitmq:
    image: rabbitmq:4.3.6-management
    # Имя узла rabbit@<hostname>: без фиксированного имени данные в томе не переживут пересоздание
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
      # Docker Desktop 29: Erlang не может прочитать cookie, который сам создал (eacces),
      # и брокер падает на старте. Cookie задаём явно серверу и CLI (healthcheck, rabbitmqctl)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-mlops-phishing}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-mlops-phishing}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  # Одноразово задаёт топологию: очередь tasks, policy с лимитами, DLX и DLQ
  rabbitmq-init:
    build:
      context: .
    image: mlops-phishing:local
    restart: "no"
    command: ["python", "-m", "mlops_phishing.rabbit_setup"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      TASKS_QUEUE_MAX_LENGTH: ${TASKS_QUEUE_MAX_LENGTH:-100}
      TASKS_DELIVERY_LIMIT: ${TASKS_DELIVERY_LIMIT:-3}
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging: *default-logging

  # Воркер: задачи из очереди → модель → результат в базу. Порт наружу не публикуем,
  # чтобы работал docker compose up -d --scale worker=2
  worker:
    image: mlops-phishing:local
    restart: unless-stopped
    command: ["faststream", "run", "mlops_phishing.worker:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mlops_phishing}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-phishing-url-clf}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      MLFLOW_DISABLE_TELEMETRY: "true"
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-4}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-4}
      INFERENCE_DELAY_SECONDS: ${INFERENCE_DELAY_SECONDS:-0.2}
      WORKER_GRACEFUL_TIMEOUT: ${WORKER_GRACEFUL_TIMEOUT:-30}
    # Больше graceful timeout воркера: Docker не добьёт SIGKILL, пока задачи дописываются
    stop_grace_period: 40s
    # Healthcheck образа смотрит на /healthz приложения, у воркера свой /health
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    logging: *default-logging

  mlflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # MLflow Artifact Store: S3-совместимое хранилище файлов (графики, модели)
  s3:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mlflow}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mlflow-secret}
      RUSTFS_SERVER_DOMAINS: s3:9000
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9001:9001" # веб-консоль: посмотреть файлы в бакете
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # Одноразово создаёт бакет и завершается
  s3-init:
    image: amazon/aws-cli:2.33.25
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mlflow}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mlflow-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket mlflow
        || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket mlflow
    depends_on:
      s3:
        condition: service_healthy
    logging: *default-logging

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0-full
    restart: unless-stopped
    # Файлы клиенты отдают серверу, а он кладёт их в s3, ключи от хранилища есть только здесь
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/${MLFLOW_DB_NAME:-mlflow}
      - --artifacts-destination
      - s3://mlflow
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "2"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mlflow}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mlflow-secret}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:*,localhost:*,127.0.0.1:*
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "5050:5000" # 5000 на macOS занят AirPlay
    depends_on:
      mlflow-db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

volumes:
  postgres_data:
  rabbitmq_data:
  mlflow_db_data:
  s3_data:
