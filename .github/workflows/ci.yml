name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lock-файл синхронен с pyproject
        run: uv lock --check
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pytest (порог покрытия из pyproject роняет job)
        run: uv run pytest

  smoke:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build & start (app, postgres, MLflow stack)
        env:
          GIT_COMMIT: ${{ github.sha }}
        # Запас на скачивание образа MLflow (~380 MB) и его миграции на первом старте
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check endpoints
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/api/v1/version | tee version.json
          curl -fsS http://localhost:8000/api/v1/health
      - name: Compose logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
