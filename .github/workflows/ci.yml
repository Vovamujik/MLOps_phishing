name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lock-файл синхронен с pyproject
        run: uv lock --check
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pytest (порог покрытия из pyproject роняет job)
        run: uv run pytest

  smoke:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Seed-скрипту нужен клиент MLflow и код обучения
      - run: uv sync --frozen --group ml
      - name: Start MLflow stack
        # Запас на скачивание образа MLflow (~380 MB) и его миграции на первом старте
        run: docker compose up -d --wait --wait-timeout 180 mlflow
      - name: Register seed model as champion
        # MLflow в CI пустой: без модели воркер не стартует, и конвейер не проверить
        run: uv run python -m training.seed_ci_model
      - name: Build & start stack
        # API, RabbitMQ и воркер; источник в профиле source и сам не стартует
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check endpoints
        # bash с pipefail: иначе падение curl в `curl | tee` не роняет шаг
        shell: bash
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/api/v1/version | tee version.json
          curl -fsS http://localhost:8000/api/v1/health
          # Задача через очередь: 202 сразу, результат появится, когда воркер посчитает
          curl -fsS -X POST http://localhost:8000/api/v1/tasks \
            -H 'Content-Type: application/json' \
            -d '{"url": "http://paypal-secure-login.verify-account.xyz/signin"}' | tee accepted.json
          status_url=$(python3 -c "import json; print(json.load(open('accepted.json'))['status_url'])")
          for _ in $(seq 30); do
            curl -fsS "$status_url" | tee task.json
            python3 -c "import json, sys; sys.exit(json.load(open('task.json'))['status'] != 'DONE')" && break
            sleep 1
          done
          python3 -c "import json; body = json.load(open('task.json')); assert body['status'] == 'DONE' and body['model_version'] == '1', body"
      - name: Compose logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
