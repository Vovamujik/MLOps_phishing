# Источники данных с фиксированными UID: на них ссылаются дашборд, алерты и переходы
# между сигналами. `$$` — экранирование: иначе Grafana подставит переменную окружения.
apiVersion: 1

# Удаляем то, что могли накликать руками, — состояние задаёт только этот файл
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      prometheusType: Prometheus
      httpMethod: POST
      # Равен scrape_interval и интервалу экспорта OTLP: $__rate_interval = 4 × 5 с = 20 с
      timeInterval: 5s
      # Точка-exemplar на гистограмме латентности → трейс этого запроса в Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Открыть трейс

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Лог → трейс одним кликом: trace_id лежит в structured metadata записи,
      # Grafana показывает его как поле и делает из него ссылку на Tempo
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Открыть трейс

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Спан → логи всего трейса во всех сервисах (api, worker), с запасом по времени:
      # строки лога пишутся до и после границ спана
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        customQuery: true
        query: '{service=~".+"} | trace_id="$${__trace.traceId}"'
      # Спан → метрики сервиса за то же время
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: job
        queries:
          - name: Обработано задач/с
            query: sum by (result) (rate(worker_tasks_processed_total{$$__tags}[1m]))
          - name: p95 inference
            query: histogram_quantile(0.95, sum by (le) (rate(worker_inference_duration_seconds_bucket{$$__tags}[1m])))
      lokiSearch:
        datasourceUid: loki
      nodeGraph:
        enabled: true
      search:
        hide: false
